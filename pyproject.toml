[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "townlight-access"
version = "0.5.0"
description = "townlight_access runtime foundation for accessibility, plain-language, multilingual, and ADA review support."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-CODE"]
authors = [
  { name = "Townlight contributors" }
]
dependencies = [
  "townlight-core==1.3.0.dev2",
  "fastapi>=0.115.0,<1.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.scripts]
townlight_access-db-status = "townlight_access.db_admin:main"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["townlight_access"]

[tool.hatch.build.targets.sdist]
include = [
  "townlight_access",
  "scripts",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "USER-MANUAL.md",
  "LICENSE-CODE",
  "LICENSE-DOCS",
]

[tool.ruff]
target-version = "py311"
line-length = 100


