name: verify

on:
  push:
  pull_request:

jobs:
  # Docs-only changes start no CI run (docs get push, merge and publish only).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is docs. Anything unknown counts as code.
          docs_re='(\.(md|mdx|rst|docx|pdf)$)|(^|/)(LICENSE|NOTICE)(\.[^/]*)?$|^docs/.*\.(png|jpe?g|svg|gif|webp|html|css)$'
          keep_re='(^|/)SKILL\.md$|(^|/)(skills|agents|commands|prompts|references)/|^\.claude/'
          files=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files=""
          fi
          code=true
          if [ -n "$files" ]; then
            other=$(printf '%s\n' "$files" | grep -Ev "$docs_re" || true)
            kept=$(printf '%s\n' "$files" | grep -E "$docs_re" | grep -E "$keep_re" || true)
            if [ -z "$other" ] && [ -z "$kept" ]; then code=false; fi
          fi
          echo "Changed files:"; printf '%s\n' "$files" | head -50
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: civicaccess
          POSTGRES_USER: civicaccess
          POSTGRES_DB: civicaccess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicaccess -d civicaccess_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CivicCore release wheel
        run: python -m pip install https://github.com/townlight/core/releases/download/v1.2.0/civiccore-1.2.0-py3-none-any.whl
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Assert CivicCore release version
        run: python -c "import civiccore; assert civiccore.__version__ == '1.2.0', civiccore.__version__"
      - name: Run release gate
        env:
          CIVICACCESS_POSTGRES_TEST_URL: postgresql+psycopg2://civicaccess:civicaccess@localhost:5432/civicaccess_test
        run: bash scripts/verify-release.sh
